name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to build and upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: bash tools/release-asset.sh build "$TAG" out
      - run: shellcheck -s sh out/bootstrap.sh
      - name: Upload checksummed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/bootstrap.sh out/SHA256SUMS "out/pi-setup-$TAG.tar.gz" --clobber
